# (*.srvxapp.com) and srv-cc-wildcard (*.srvx.cc) -- were removed on 2026-09-10.
# Nothing consumed them: no pod mounted srvxapp-com-tls or srv-cc-tls, every
# *.srvx.cc Ingress runs without TLS because Cloudflare terminates it, and
# ingress-nginx has no --default-ssl-certificate. They spent 171 days raising
# CertificateExpired at critical for certificates nobody used. Git history has
# them if a direct-TLS setup ever needs them back.
