# Referenced by minio-operator/minio-api-tls, minio-operator/minio-console-tls
# and redis/redis-tls, none of which could ever be issued because this
# ClusterIssuer did not exist -- letsencrypt-dns was the only one in the
# cluster. All three sat on
#   DoesNotExist: Issuing certificate as Secret does not exist
# for ~167 days. They cover internal .local hostnames, where a self-signed
# issuer is the right answer; Let's Encrypt cannot issue for .local at all.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: selfsigned-issuer
spec:
    selfSigned: {}
sops:
    kms: []
