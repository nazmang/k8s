persistence:
  # local-path, not nfs-client. Kuma keeps its database in SQLite, and SQLite on
  # NFS is the root of the false alerts this cluster chased for months: an NFS
  # stall blocks the Node event loop, beat() throws KnexTimeoutError before it can
  # record a heartbeat, and Kuma reports the exception as the monitored service
  # being down. It also failed the liveness probe often enough to rack up 413
  # container restarts in 129 days.
  #
  # The volume is now node-local, so the pod is pinned to whichever node it first
  # landed on and the data does not survive that node's disk. That is acceptable
  # here: PVE backs up the VMs whole to external storage, and the database is 6MB
  # of monitor config plus history rather than anything irreplaceable.
  storageClass: "local-path"
  size: 5Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    external-dns.alpha.kubernetes.io/hostname: uptime-kuma.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  host: uptime-kuma.srvx.cc

httpRoute:
  enabled: false
  annotations:
    external-dns.alpha.kubernetes.io/hostname: uptime-kuma.srvx.cc
  parentRefs:
    - name: srvx-cc-gateway
      namespace: gateway
  hostname: uptime-kuma.srvx.cc
