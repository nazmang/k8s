# argocd.srvx.cc on the kgateway Gateway `public` (k8s helm-kgateway).
# Chart 7.7.16 has no HTTPRoute support, and argocd.values.yaml is sops-encrypted,
# so the route is a plain manifest here. argocd-server runs with --insecure:
# port 80 is plain HTTP. Cloudflare Access guards the host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: kgateway-system
  hostnames:
    - argocd.srvx.cc
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
