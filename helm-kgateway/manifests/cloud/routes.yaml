# Hosts moved from ingress-nginx. The Cloudflare tunnel sends a host here
# only after its rule is added before the *.srvx.cc wildcard (terraform infra/cloudflare).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: kgateway-system
  hostnames:
    - alertmanager.srvx.cc
  rules:
    - backendRefs:
        - name: prometheus-kube-prometheus-alertmanager
          port: 9093
---
