# Gateway-wide defaults close to ingress-nginx: no total request timeout
# (long downloads, WebSocket), idle streams closed after 1h.
# Per-app HTTPRoutes and their policies live with the apps, not here.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: public-defaults
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  timeouts:
    request: 0s
    streamIdle: 1h
---
# WebSocket upgrades on the listener (Envoy rejects Upgrade with 403 otherwise).
# ingress-nginx allowed them by default; uptime-kuma, ntfy, n8n and openclaw need them.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: public-upgrades
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  default:
    httpSettings:
      upgradeConfig:
        enabledUpgrades:
          - websocket
      accessLog:
        # JSON to stdout, picked up by fluent-bit (k8s-logging). Path without
        # the query string: tokens sometimes travel there.
        - fileSink:
            path: /dev/stdout
            jsonFormat:
              start_time: "%START_TIME%"
              authority: "%REQ(:AUTHORITY)%"
              method: "%REQ(:METHOD)%"
              path: "%PATH(NQ)%"
              protocol: "%PROTOCOL%"
              status: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration_ms: "%DURATION%"
              upstream_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              route: "%ROUTE_NAME%"
              client_ip: "%REQ(CF-CONNECTING-IP)%"
              downstream_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              upgrade: "%REQ(UPGRADE)%"
