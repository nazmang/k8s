# Gateway-wide defaults close to ingress-nginx: no total request timeout
# (long downloads, WebSocket), idle streams closed after 1h.
# Per-app HTTPRoutes and their policies live with the apps, not here.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: public-defaults
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  timeouts:
    request: 0s
    streamIdle: 1h
---
# WebSocket upgrades on the listener (Envoy rejects Upgrade with 403 otherwise).
# ingress-nginx allowed them by default; uptime-kuma, ntfy, n8n and openclaw need them.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: public-upgrades
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  default:
    httpSettings:
      upgradeConfig:
        enabledUpgrades:
          - websocket
