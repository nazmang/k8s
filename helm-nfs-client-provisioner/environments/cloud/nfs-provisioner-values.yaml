replicaCount: 1
strategyType: Recreate

image:
  repository: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner
  tag: v4.0.2
  pullPolicy: IfNotPresent
imagePullSecrets: []

nfs:
  # IP, not the hostname. Nothing in the cluster's DNS resolves "nas01" --
  # resolution rested entirely on a hand-added /etc/hosts line, which cloud-init
  # rewrites on every boot (manage_etc_hosts is True). On 2026-09-09 a node
  # reboot took that line away and every NFS mount on it failed with
  # `mount.nfs: Resource temporarily unavailable`, which reads like a server
  # fault and is not one. The entry is now in the cloud-init template on all four
  # nodes as well, but this removes the dependency instead of propping it up.
  #
  # Only affects PVs created from here on. The 27 that already existed CANNOT be
  # converted: spec.persistentvolumesource is immutable after creation, so a
  # patch is refused with
  #   Forbidden: spec.persistentvolumesource is immutable after creation
  # Moving them would mean recreating each PVC and copying its data, which is
  # not worth it. They keep resolving nas01 through the /etc/hosts entry, which
  # now survives reboots because it is in the cloud-init template. New volumes
  # simply stop adding to that pile.
  server: 10.163.11.100
  path: /srv/data
  # NFSv4.1, not the negotiated 4.2. In 4.2 copy_file_range() becomes a
  # server-side async COPY and the client waits for a CB_OFFLOAD callback.
  # Since the NFS server booted kernel 6.8.0-149 (2026-11-17) that callback
  # does not arrive: an in-volume fs.copyFile() blocked forever in
  # handle_async_copy while the callback channel was UP. 4.1 has no COPY, so
  # the kernel falls back to read/write.
  #
  # The chart puts these options on the StorageClass (new PVs only) and, as a
  # side effect, mounts its own root through a separate PV/PVC instead of an
  # inline volume. Existing PVs keep 4.2 until their spec.mountOptions is set
  # (that field is mutable) and the pod using them is recreated.
  mountOptions:
    - nfsvers=4.1
  volumeName: nfs-subdir-external-provisioner-root
  # Reclaim policy for the main nfs volume
  reclaimPolicy: Retain

# For creating the StorageClass automatically:
storageClass:
  create: true

  # Set a provisioner name. If unset, a name will be generated.
  # provisionerName:

  # Set StorageClass as the default StorageClass
  # Ignored if storageClass.create is false
  defaultClass: false

  # Set a StorageClass name
  # Ignored if storageClass.create is false
  name: nfs-client

  # Allow volume to be expanded dynamically
  allowVolumeExpansion: true

  # Method used to reclaim an obsoleted volume
  reclaimPolicy: Delete

  # When set to false your PVs will not be archived by the provisioner upon deletion of the PVC.
  archiveOnDelete: true

  # If it exists and has 'delete' value, delete the directory. If it exists and has 'retain' value, save the directory.
  # Overrides archiveOnDelete.
  # Ignored if value not set.
  onDelete:

  # Specifies a template for creating a directory path via PVC metadata's such as labels, annotations, name or namespace.
  # Ignored if value not set.
  pathPattern:

  # Set access mode - ReadWriteOnce, ReadOnlyMany or ReadWriteMany
  accessModes: ReadWriteOnce

  # Set volume bindinng mode - Immediate or WaitForFirstConsumer
  volumeBindingMode: Immediate

  # Storage class annotations
  annotations: {}

leaderElection:
  # When set to false leader election will be disabled
  enabled: true

## For RBAC support:
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# If true, create & use Pod Security Policy resources
# https://kubernetes.io/docs/concepts/policy/pod-security-policy/
podSecurityPolicy:
  enabled: false

# Deployment pod annotations
podAnnotations: {}

## Set pod priorityClassName
# priorityClassName: ""

podSecurityContext: {}

securityContext: {}

serviceAccount:
  # Specifies whether a ServiceAccount should be created
  create: true

  # Annotations to add to the service account
  annotations: {}

  # The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Additional labels for any resource created
labels: {}

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
