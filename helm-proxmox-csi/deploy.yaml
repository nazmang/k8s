# Proxmox CSI (sergelogvinov/proxmox-csi-plugin): block volumes on pve01's
# LVM-thin, attached to the k8s VMs through the Proxmox API.
#
# The chart is published only as OCI (ghcr.io); the helm step handles an
# oci:// repoUrl without `helm repo add` (platform-deploy-lib#1).
# secrets.yaml is decrypted in place first and passed as a second values file.
steps:

  - type: decrypt-sops
    environments:
      cloud:
        config:
          keyParameter: SOPS_AGE_KEY
          files:
            - environments/cloud/secrets.yaml

  - type: helm
    environments:
      cloud:
        config:
          repoUrl: oci://ghcr.io/sergelogvinov/charts
          chartName: proxmox-csi-plugin
          version: 0.5.12
          releaseName: proxmox-csi
          namespace: csi-proxmox
          values:
            - environments/cloud/values.yaml
            - environments/cloud/secrets.yaml

  - type: manifest
    environments:
      cloud:
        config:
          file:
            - environments/cloud/prometheusrule.yaml
