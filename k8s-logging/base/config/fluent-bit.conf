[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

    storage.type filesystem
    storage.path /buffers
    storage.sync normal
    storage.backlog.mem_limit 50M

# access (stdout)
[FILTER]
    Name          rewrite_tag
    Match         nginx.raw
    Rule          $stream ^stdout$ nginx.access false

# error (stderr)
[FILTER]
    Name          rewrite_tag
    Match         nginx.raw
    Rule          $stream ^stderr$ nginx.error false

[FILTER]
    Name          parser
    Match         nginx.access
    Key_Name      log
    Parser        nginx_access
    Reserve_Data  On

[FILTER]
    Name          parser
    Match         nginx.error
    Key_Name      log
    Parser        nginx_error
    Reserve_Data  On

[FILTER]
    Name    modify
    Match   nginx.access
    Add     endpoint $request

[FILTER]
    Name    lua
    Match   nginx.access
    script  type_cast.lua
    call    cast_nginx_fields

[FILTER]
    Name          modify
    Match         nginx.*
    Add           service ingress-nginx

# kgateway (Envoy): only stdout carries the access log; stderr is Envoy's own log
[FILTER]
    Name          rewrite_tag
    Match         envoy.raw
    Rule          $stream ^stdout$ envoy.access false

[FILTER]
    Name          parser
    Match         envoy.access
    Key_Name      log
    Parser        envoy_json
    Reserve_Data  On

[FILTER]
    Name          modify
    Match         envoy.access
    Add           service kgateway

# Application pods: metadata first, then keep only pods with
# logging.homelab/ship=true and only the lines their allowlist names.
[FILTER]
    Name                kubernetes
    Match               app.raw.*
    Kube_Tag_Prefix     app.raw.var.log.containers.
    Merge_Log           Off
    Labels              Off
    Annotations         On
    Buffer_Size         0
    Kube_Meta_Cache_TTL 300s

[FILTER]
    Name    grep
    Match   app.raw.*
    Regex   $kubernetes['annotations']['logging.homelab/ship'] ^true$

[FILTER]
    Name    lua
    Match   app.raw.*
    script  app_allow.lua
    call    app_allow

[FILTER]
    Name          rewrite_tag
    Match         app.raw.*
    Rule          $logger .+ app.marks false

@INCLUDE input-kubernetes.conf
@INCLUDE output.conf