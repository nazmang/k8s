[INPUT]
    Name              tail
    Path              /var/log/containers/*ingress-nginx-controller*.log
    Parser            cri
    Tag               nginx.raw
    Mem_Buf_Limit     150MB
    Skip_Long_Lines   On
    Refresh_Interval  5

    storage.type      filesystem

# kgateway Envoy proxies: JSON access log on stdout (ListenerPolicy accessLog).
[INPUT]
    Name              tail
    Path              /var/log/containers/*_kgateway-system_kgateway-proxy-*.log
    Parser            cri
    Tag               envoy.raw
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

    storage.type      filesystem

# Application pods that opt in with the logging.homelab/ship annotation
# (app_allow.lua). The platform logs above have their own inputs; this
# namespace is skipped so fluentd's stdout never loops back.
[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Exclude_Path      /var/log/containers/*_logging_*.log,/var/log/containers/*ingress-nginx-controller*.log,/var/log/containers/*_kgateway-system_*.log
    Parser            cri
    Tag               app.raw.*
    DB                /buffers/app-tail.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10

    storage.type      filesystem
