---
fullnameOverride: external-dns-clouflare

logLevel: debug
logFormat: text

interval: 5s
# gateway-httproute publishes HTTPRoute hostnames of both kgateway Gateways:
# - private: its LoadBalancer address 10.164.12.64, A records, DNS only;
# - public: sits behind the Cloudflare tunnel, its address is a ClusterIP, so
#   the Gateway carries external-dns.alpha.kubernetes.io/target (the tunnel
#   CNAME) and each route carries cloudflare-proxied: "true" (kgw-09).
# A public route without that annotation gets an unproxied CNAME, which does
# not work for a tunnel. The chart adds the gateway.networking.k8s.io RBAC by itself.
sources: ["ingress", "service", "crd", "gateway-httproute"]
registry: txt
txtOwnerId: default
txtPrefix: k8s.
domainFilters: ["srvx.cc"]
excludeDomains: []
policy: sync

provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
# kubectl create secret generic cloudflare-api-key --from-literal=apiKey=YOUR_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: apiKey

extraArgs:
  - --ignore-ingress-tls-spec
  - --gateway-namespace=kgateway-system
  - --managed-record-types=A
  - --managed-record-types=AAAA
  - --managed-record-types=CNAME
  - --managed-record-types=TXT
  - --managed-record-types=MX
  - --managed-record-types=SRV
  - --managed-record-types=NS
