---
fullnameOverride: external-dns-clouflare

logLevel: debug
logFormat: text

interval: 5s
# gateway-httproute publishes HTTPRoute hostnames with the Gateway's address.
# Limited to Gateway kgateway-system/private (LoadBalancer 10.164.12.64): the
# public Gateway sits behind the Cloudflare tunnel, its hostnames are CNAMEs
# managed in terraform and its address is a ClusterIP, so it must not be
# published. The chart adds the gateway.networking.k8s.io RBAC by itself.
sources: ["ingress", "service", "crd", "gateway-httproute"]
registry: txt
txtOwnerId: default
txtPrefix: k8s.
domainFilters: ["srvx.cc"]
excludeDomains: []
policy: sync

provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
# kubectl create secret generic cloudflare-api-key --from-literal=apiKey=YOUR_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: apiKey

extraArgs:
  - --ignore-ingress-tls-spec
  - --gateway-namespace=kgateway-system
  - --gateway-name=private
  - --managed-record-types=A
  - --managed-record-types=AAAA
  - --managed-record-types=CNAME
  - --managed-record-types=TXT
  - --managed-record-types=MX
  - --managed-record-types=SRV
  - --managed-record-types=NS
