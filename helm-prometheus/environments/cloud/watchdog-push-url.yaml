# Uptime Kuma push URL for the cluster's dead man's switch.
#
# The Watchdog alert fires permanently by design and its whole value is in being
# noticed when it STOPS. Until 2026-09-11 it was routed to the 'null' receiver,
# so nothing watched for its absence: if this Prometheus and this Alertmanager
# died together, there would be nobody left to evaluate a rule about them.
#
# The URL carries a token, and both repositories holding this configuration are
# public -- hence a Secret rather than a value in prometheus-values.yaml. The
# key name ends in Secret so the broad encrypted_regex in .sops.yaml covers it.
#
# Alertmanager reads it through webhook_configs.url_file, and the chart mounts
# the Secret via alertmanagerSpec.secrets. Recreate the live Secret with:
#
#   kubectl create secret generic alertmanager-watchdog -n monitoring \
#     --from-literal=url="$(sops -d watchdog-push-url.yaml | yq -r .pushUrlSecret)"
#
# Anyone holding this URL can keep the dead man's switch alive while the
# monitoring behind it is dead -- which is precisely the failure it exists to
# catch. Treat it as a credential.
pushUrlSecret: ENC[AES256_GCM,data:frE3GmzXlZVQ6IsaO/avhcJzcVO6R/h5yysWe9WFUhX+VOE0a+0POiYSIWTi07GKOsC969XD+EQXvKP+6JJzOJK8GcCWi66yDdl+qzWSrd3DE4dDFWIYZm7R05o=,iv:Ml9F5aQoDERvYxXbfQXwA7KQgoa3O3k5nrUTpBNqjnU=,tag:DqzWRbtEUDa2DOfMEPiHvg==,type:str]
