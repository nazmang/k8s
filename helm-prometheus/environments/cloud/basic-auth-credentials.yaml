# Basic-auth credentials for alertmanager.srvx.cc and prom-k8s.srvx.cc.
#
# Until 2026-09-10 both ingresses were open to the internet with no
# authentication -- anyone could read every alert and create silences. The
# annotations that closed that are in prometheus-values.yaml beside this file;
# this is the Secret they point at, which the chart does not create.
#
# The `password` field is encrypted by the rule in .sops.yaml (it matches
# .*password.*). Recreate the live Secret from these values with:
#
#   htpasswd -nbB {username} {password} > auth
#   kubectl create secret generic monitoring-basic-auth -n monitoring \
#     --from-file=auth --dry-run=client -o yaml | kubectl apply -f -
#
# The htpasswd hash is deliberately NOT stored here: it is derived from the
# password, and keeping one copy of a credential is better than keeping two.
