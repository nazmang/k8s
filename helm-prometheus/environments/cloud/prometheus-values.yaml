grafana:
  enabled: false

# kube-proxy binds its metrics to 127.0.0.1:10249, so Prometheus cannot reach it
# and all four targets sat down permanently, keeping TargetDown firing. Opening
# the port means a kubespray change plus a kube-proxy restart on every node, and
# the metrics it would yield -- rule-sync duration, endpoint counts -- are for
# clusters with tens of thousands of rules, not four nodes. Nothing is lost by
# not scraping it: kube-proxy's pod health is still covered by kube-state-metrics,
# and if kube-proxy actually dies, services break loudly.
#
# Set this to true and configure kube_proxy_metrics_bind_address in kubespray if
# those metrics are ever wanted.
kubeProxy:
  enabled: false

  
alertmanager:
  enabled: true

  # Until 2026-09-10 this section was absent, so the chart's default config
  # applied: a single receiver named `null` that every route ended at. The stack
  # collected metrics and evaluated 154 alerting rules for months while
  # delivering nothing -- 15 alerts were queued behind it, three at critical.
  #
  # Alerts now go to ntfy through the ntfy-alertmanager bridge (deployed from the
  # argocd-apps repo into this namespace). The bridge exists because
  # Alertmanager's webhook posts its own JSON with no body templating, so
  # pointing it straight at ntfy publishes the raw payload as the message text.
  config:
    global:
      resolve_timeout: 5m

    # Kept verbatim from the chart defaults. Without these, a node going down
    # delivers the critical alert plus every warning and info alert it causes.
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal: ['namespace', 'alertname']
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal: ['namespace', 'alertname']
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal: ['namespace']
      - target_matchers:
          - 'alertname = InfoInhibitor'

    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'ntfy'
      routes:
        # Watchdog fires constantly by design: it is a dead man's switch, meant
        # to be noticed when it STOPS arriving. Delivering it to a phone every
        # 12 hours would be pure noise, so it still goes nowhere -- but that
        # means nothing currently watches for its absence. Uptime Kuma's "push"
        # monitor type would close that gap: point this route at the push URL
        # and Kuma complains when the heartbeat stops.
        # Dead man's switch, wired up 2026-09-11. Previously 'null', with the
        # comment above explaining exactly this gap for anyone who read it.
        #
        # repeat_interval here is 5m rather than the 12h above: the point is a
        # steady heartbeat, and the Kuma monitor waits 900s before complaining,
        # so two beats can be lost to a network hiccup without an incident.
        # send_resolved is off -- this alert never resolves.
        - receiver: 'deadmansswitch'
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m

    receivers:
      # Kept: kube-prometheus-stack ships routes that reference it.
      - name: 'null'
      # The URL carries a token and this repository is public, so it arrives
      # through a mounted Secret rather than living here. See
      # watchdog-push-url.yaml beside this file, and alertmanagerSpec.secrets
      # below for the mount.
      - name: 'deadmansswitch'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-watchdog/url
            send_resolved: false
            max_alerts: 0
      - name: 'ntfy'
        webhook_configs:
          # In-cluster: does not depend on the Cloudflare tunnel or DNS beyond
          # the cluster. No basic auth -- both repos holding this config are
          # public, so a shared password would need its own decryption path for
          # what is a hop between two pods in one namespace.
          - url: 'http://ntfy-alertmanager.monitoring.svc.cluster.local:8080/'
            send_resolved: true
            max_alerts: 0

  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-watchdog/ -- the chart
    # takes the list and Alertmanager reads the file through url_file. The
    # Secret is not created by this chart; see watchdog-push-url.yaml.
    secrets:
      - alertmanager-watchdog

  ingress:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: alertmanager.srvx.cc
      external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
      external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      # Basic auth, added 2026-09-10. Both of these ingresses were reachable
      # from the internet with no authentication whatsoever -- verified by a
      # POST to /api/v2/silences returning 422, i.e. the request reached
      # payload validation. Anyone could read every alert and, worse, create
      # silences: muting the monitoring of an infrastructure from outside it,
      # quietly, is the first move before anything that would be noticed.
      #
      # The credentials live in the Secret monitoring-basic-auth (namespace
      # monitoring, key `auth`, htpasswd with bcrypt). The Secret itself is not
      # created by this chart -- see basic-auth-credentials.yaml beside this
      # file for the encrypted copy and how to recreate it.
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Monitoring - authentication required"
    labels: {}
    ingressClassName: nginx
    hosts:
      - alertmanager.srvx.cc
    paths: []
    # - /

    ## For Kubernetes >= 1.18 you should specify the pathType (determines how Ingress paths should be matched)
    ## See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## TLS configuration for Alertmanager Ingress
    ## Secret must be manually created in the namespace
    ##
    # tls: 
    # - secretName: srvxapp-com-tls
    #   hosts:
    #   - alertmanager.srvx.cc
prometheus:
  prometheusSpec:
    scrapeInterval: 1m
    evaluationInterval: 1m

    # Persistent storage, added 2026-09-11. Until now Prometheus ran on an
    # emptyDir: every restart of the pod erased every metric. That is not an
    # abstract loss -- it came up the moment someone asked how often n8n falls
    # over, and the answer was "there is no history, the pod restarted
    # yesterday evening". Alerting without history can tell you that something
    # is broken now, and nothing about whether it has been breaking for months.
    #
    # local-path, not nfs-client, on purpose: the TSDB does fsync-heavy random
    # writes and behaves on NFS exactly as SQLite did for Uptime Kuma and n8n.
    # The cost is that the volume lives on one node (currently k8s03) and the
    # pod cannot move without it -- acceptable for a single-replica Prometheus,
    # and the operator recreates an empty one if the node is ever lost.
    #
    # The size cap is not decoration: the TSDB grows about 1 GB/day here and
    # k8s03 had 13.5 GB free. retentionSize is what actually bounds it --
    # `retention: 10d` alone would have filled the node's root disk in under
    # two weeks and taken the kubelet with it.
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    thanos:
      image: thanosio/thanos:v0.40.1
      # secretProviderClass:
      #   provider: gcp
      #   parameters:
      #     secrets: |
      #       - resourceName: "projects/$PROJECT_ID/secrets/testsecret/versions/latest"
      #         fileName: "objstore.yaml"
      # ObjectStorageConfig configures object storage in Thanos.
      objectStorageConfig:
        # use existing secret, if configured, objectStorageConfig.secret will not be used
        # existingSecret: 
        #   name: "thanos-storage-config"
        #   key: "object-storage-configs.yaml"
  # service:
  #   type: LoadBalancer
  #   loadBalancerIP: "10.0.55.2"
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true   
  # Ingress exposes thanos sidecar outside the cluster
  thanosIngress:
    enabled: false

    # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
    # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
    ingressClassName: nginx

    annotations: {}
    labels: {}
    servicePort: 10901

    ## Port to expose on each node
    ## Only used if service.type is 'NodePort'
    ##
    nodePort: 30901

    ## Hosts must be provided if Ingress is enabled.
    ##
    hosts:
       - thanos-gateway.comintern.local

    ## Paths to use for ingress rules
    ##
    paths: 
      - /

    ## For Kubernetes >= 1.18 you should specify the pathType (determines how Ingress paths should be matched)
    ## See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    pathType: ImplementationSpecific

    ## TLS configuration for Thanos Ingress
    ## Secret must be manually created in the namespace
    ##
    # tls: 
    # - secretName: thanos-gateway-tls
    #   hosts:
    #   - thanos-gateway.comintern.local
       
  ingress:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: prom-k8s.srvx.cc
      external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
      external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      # Basic auth, added 2026-09-10. Both of these ingresses were reachable
      # from the internet with no authentication whatsoever -- verified by a
      # POST to /api/v2/silences returning 422, i.e. the request reached
      # payload validation. Anyone could read every alert and, worse, create
      # silences: muting the monitoring of an infrastructure from outside it,
      # quietly, is the first move before anything that would be noticed.
      #
      # The credentials live in the Secret monitoring-basic-auth (namespace
      # monitoring, key `auth`, htpasswd with bcrypt). The Secret itself is not
      # created by this chart -- see basic-auth-credentials.yaml beside this
      # file for the encrypted copy and how to recreate it.
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Monitoring - authentication required"
    ingressClassName: nginx
    hosts:
      - prom-k8s.srvx.cc
    paths: []
    tls: []